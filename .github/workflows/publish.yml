name: Publish Modpack
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: allows git log to see previous commits

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Build CurseForge Zip
        id: build
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          packwiz curseforge export -o "create-flight-${VERSION}.zip"
          echo "filename=create-flight-${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: changelog
        run: |
          # Grabs the last 5 commit messages to use as a changelog
          echo "notes=$(git log -5 --pretty=format:'- %s' --no-merges)" >> $GITHUB_OUTPUT

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: '1526879' 
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: "./${{ steps.build.outputs.filename }}"
          name: "Create Flight-${{ steps.build.outputs.version }}"
          curseforge-loaders: 'neoforge'
          curseforge-game-versions: '1.21.1'
          changelog: ${{ steps.changelog.outputs.notes }}
